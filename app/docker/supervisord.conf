; Trois processus dans le conteneur : le serveur web, PHP, et le travailleur de
; file d'attente. Ce dernier traite les envois et les tâches longues à part, pour
; que l'acheteur n'attende jamais un serveur de messagerie.
[supervisord]
nodaemon=true
logfile=/dev/stdout
logfile_maxbytes=0

[program:php-fpm]
command=php-fpm -F
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=nginx -g "daemon off;"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:file-attente]
command=php /var/www/artisan queue:work --sleep=3 --tries=3 --max-time=3600
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
